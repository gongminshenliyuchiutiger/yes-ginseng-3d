<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>《夜市人蔘》YES! GINSENG ｜臺灣夜市美食3D數位桌遊</title>

  <!-- Google Fonts：繁體中文襯線、黑體與韓文 Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&family=Noto+Sans+TC:wght@400;600;700;800&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free：全站唯一圖示系統 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 3D 夜市桌遊主畫布 -->
  <div id="scene-3d-mount" aria-label="夜市人蔘 3D 桌遊場景"></div>

  <!-- 美食小當家風格全螢幕料理發光 / 攻防特效層 -->
  <div id="fx-stage" class="fx-stage" aria-hidden="true"></div>

  <!-- 頂部 HUD 資訊與功能列 -->
  <header class="top-hud">
    <div class="brand-box">
      <div class="brand-icon"><i class="fa-solid fa-bowl-food"></i></div>
      <div id="brand-title-text" class="brand-title">夜市人蔘 3D</div>
    </div>

    <div class="hud-center">
      <div id="hud-turn-badge" class="hud-pill">
        <i class="fa-solid fa-fire-burner"></i> 準備開張
      </div>
      <div id="hud-mode-badge" class="hud-pill">
        <i class="fa-solid fa-utensils"></i> 標準模式
      </div>
      <div id="hud-deck-counts" class="hud-pill hud-deck-pill">
        <span><i class="fa-solid fa-layer-group"></i> 食材 46</span>
        <span><i class="fa-solid fa-bolt"></i> 攻防 27</span>
        <span><i class="fa-solid fa-book-open"></i> 餐點 26</span>
      </div>
    </div>

    <div class="hud-actions">
      <div class="cam-group" title="切換 3D 視角">
        <button class="icon-btn icon-only active" data-cam="default" title="標準立體視角" aria-label="標準立體視角">
          <i class="fa-solid fa-cube"></i>
        </button>
        <button class="icon-btn icon-only" data-cam="top" title="俯視戰術視角" aria-label="俯視戰術視角">
          <i class="fa-solid fa-chess-board"></i>
        </button>
        <button class="icon-btn icon-only" data-cam="cinema" title="夜市全景視角" aria-label="夜市全景視角">
          <i class="fa-solid fa-panorama"></i>
        </button>
      </div>

      <!-- 中／英／韓可複選疊加翻譯切換器 -->
      <div class="lang-overlay-group" role="group" aria-label="中英韓疊加語言切換">
        <button type="button" class="lang-chip active" data-lang-toggle="zh" title="繁體中文（可疊加）">中</button>
        <button type="button" class="lang-chip" data-lang-toggle="en" title="English（可疊加）">EN</button>
        <button type="button" class="lang-chip" data-lang-toggle="ko" title="한국어（可疊加）">한</button>
        <button type="button" class="lang-chip lang-all-chip" data-lang-all="true" title="一鍵中英韓三語全開">
          <i class="fa-solid fa-layer-group"></i>
        </button>
      </div>

      <button id="btn-food-guide" class="icon-btn icon-only" title="臺灣小吃文化圖鑑" aria-label="臺灣小吃文化圖鑑">
        <i class="fa-solid fa-utensils"></i>
      </button>
      <button id="btn-rules" class="icon-btn icon-only" title="官方完整規則手冊" aria-label="官方完整規則手冊">
        <i class="fa-solid fa-book-open"></i>
      </button>
      <button id="btn-toggle-log" class="icon-btn icon-only btn-toggle-log" title="戰報紀錄" aria-label="戰報紀錄">
        <i class="fa-solid fa-scroll"></i>
      </button>

      <!-- 音樂開關 + 曲風切換（小當家 / 食神交響 / Chill Jazz Lo-Fi）純符號膠囊 -->
      <div class="bgm-group" role="group" aria-label="背景音樂與曲風切換">
        <button id="btn-bgm" class="icon-btn icon-only btn-bgm" title="背景音樂開關" aria-label="背景音樂開關">
          <i class="fa-solid fa-music"></i>
        </button>
        <button id="btn-bgm-style" class="icon-btn icon-only btn-bgm-style style-god" title="食神降臨・氣勢交響" aria-label="切換音樂曲風">
          <i class="fa-solid fa-crown"></i>
        </button>
      </div>

      <button id="btn-mute" class="icon-btn icon-only" title="音效總開關" aria-label="音效總開關">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button id="btn-new-game" class="icon-btn icon-only" title="開新局" aria-label="開新局">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>
  </header>

  <!-- 對手狀態欄 -->
  <aside id="opponents-bar" class="opponents-bar" aria-label="對手攤位資訊"></aside>

  <!-- 快捷餐點列（與 3D 桌上餐點牌即時同步） -->
  <section id="orders-strip" class="orders-strip" aria-label="場上餐點列表"></section>

  <!-- 右上角夜市戰報日誌 -->
  <aside id="log-panel" class="log-panel" aria-label="夜市戰報">
    <div class="log-header">
      <i class="fa-solid fa-scroll"></i> <span id="log-header-text">夜市即時戰報</span>
    </div>
    <div id="game-log-list" class="log-list"></div>
  </aside>

  <!-- 浮動通知區 -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- 底部玩家操作臺與手牌區 -->
  <section class="bottom-dock" aria-label="玩家操作與手牌區">
    <div id="discard-banner" class="discard-banner hidden"></div>

    <div class="player-toolbar">
      <div class="player-left-info">
        <div id="player-stats" class="player-stats"></div>
        <div id="player-buffs" class="player-buffs"></div>
      </div>

      <div class="player-actions">
        <button id="btn-buy-special" class="btn btn-red" title="花費 2 元購買 1 張攻防牌">
          <i class="fa-solid fa-cart-shopping"></i> 買攻防牌 (2元)
        </button>
        <button id="btn-end-turn" class="btn btn-gold">
          <i class="fa-solid fa-forward-step"></i> 結束回合
        </button>
      </div>
    </div>

    <div id="player-hand" class="hand-tray" aria-label="你的手牌"></div>
  </section>

  <!-- 左下角可自由拖曳吉祥物（懸停霓虹彩色發光抖動） -->
  <div id="mascot-widget" title="拖曳我到任何地方！點擊看夜市小撇步">
    <div id="mascot-bubble" class="mascot-bubble"></div>
    <img src="image/LiyuChillGuy.svg" alt="LiyuChillGuy 吉祥物" class="mascot-img" draggable="false" />
  </div>

  <!-- 頁面下方頁尾：上方為 FB 粉絲專頁，下方為版權宣告 -->
  <footer class="site-footer">
    <a class="footer-fb-link" href="https://www.facebook.com/happyliyuchilltiger/" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-facebook"></i>
      <span>快樂鯉魚秋老虎</span>
    </a>
    <div class="footer-copyright">Copyright &copy; Liyuchiutiger Gongminshen</div>
  </footer>

  <!-- 開局設定面板 -->
  <div id="start-overlay" class="overlay">
    <div class="modal-card start-modal-card">
      <div class="modal-body">
        <div class="start-top-bar">
          <div class="start-lang-hint">
            <i class="fa-solid fa-globe"></i>
            <span id="start-lang-hint-text">可複選疊加中 / 英 / 韓三語同時顯示</span>
          </div>
          <div class="lang-overlay-group" role="group" aria-label="開局中英韓疊加語言切換">
            <button type="button" class="lang-chip active" data-lang-toggle="zh">中</button>
            <button type="button" class="lang-chip" data-lang-toggle="en">EN</button>
            <button type="button" class="lang-chip" data-lang-toggle="ko">한</button>
            <button type="button" class="lang-chip lang-all-chip" data-lang-all="true">
              <i class="fa-solid fa-layer-group"></i> <span class="lang-all-label">三語</span>
            </button>
          </div>
        </div>

        <div class="start-hero">
          <div class="start-emblem"><i class="fa-solid fa-seedling"></i></div>
          <h1 id="start-title-text">夜市人蔘</h1>
          <p id="start-sub-text">YES! GINSENG — 臺灣夜市美食 3D 數位桌遊</p>
        </div>

        <div class="option-section">
          <div class="option-label"><i class="fa-solid fa-flag-checkered"></i> <span id="label-mode-text">選擇遊戲模式</span></div>
          <div class="radio-grid">
            <label class="radio-tile">
              <input type="radio" name="game-mode" value="race8" checked />
              <div class="radio-box">
                <strong><i class="fa-solid fa-coins"></i> <span id="mode-race8-title">8 元搶錢大戰（變化規則・推薦）</span></strong>
                <small id="mode-race8-desc">節奏明快！首位賺滿 8 元的攤販立即獲勝。</small>
              </div>
            </label>
            <label class="radio-tile">
              <input type="radio" name="game-mode" value="standard" />
              <div class="radio-box">
                <strong><i class="fa-solid fa-trophy"></i> <span id="mode-std-title">標準街頭廚藝賽（經典規則）</span></strong>
                <small id="mode-std-desc">完成全部 26 道小吃結算，做最多道菜者奪冠。</small>
              </div>
            </label>
          </div>
        </div>

        <div class="option-section">
          <div class="option-label"><i class="fa-solid fa-users"></i> <span id="label-total-players">總玩家人數（2–6 人）</span></div>
          <div id="total-players-group" class="pill-choice-row"></div>
        </div>

        <div class="option-section">
          <div class="option-label"><i class="fa-solid fa-user-check"></i> <span id="label-human-players">實際真人玩家人數（可選全部真人）</span></div>
          <div id="human-count-group" class="pill-choice-row"></div>
          <div id="human-names-group" class="human-names-grid"></div>
          <div id="human-summary-text" class="human-summary-box"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-start-game" class="btn btn-gold" style="width: 100%; padding: 12px; font-size: 15px;">
          <i class="fa-solid fa-play"></i> <span id="btn-start-text">夜市開張！進入 3D 牌桌</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 通用互動彈窗（出菜確認 / 攻防反應 / 熱座交接 / 規則手冊 / 小吃圖鑑 / 結算） -->
  <div id="modal-overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div id="modal-card" class="modal-card">
      <div id="modal-title" class="modal-header"></div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- 高解析度臺灣夜市小吃真實照片燈箱（支援左右切換與鍵盤瀏覽） -->
  <div id="photo-lightbox" class="photo-lightbox hidden" role="dialog" aria-modal="true" aria-label="真實美食照片檢視器"></div>

  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- 遊戲腳本（含三語可疊加系統 i18n.js & 美食小當家合成音樂 audio.js） -->
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/translator.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
